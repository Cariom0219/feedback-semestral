<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Semestral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root {
  /* Feedback Semestral · azul-noite de operação + amarelo de segurança (faixa de EPI).
     Layout: coluna única no celular para quem responde; painel largo com abas para a gestão. */
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f4f7fa;
  --ink: #0f1d2e;
  --muted: #566476;
  --line: #d7dee7;
  --brand: #13345a;
  --brand-ink: #ffffff;
  --primary: #13345a;
  --primary-hover: #1d4a7e;
  --primary-ink: #ffffff;
  --accent: #f2b705;
  --accent-ink: #1b1400;
  --ok: #1b7443; --ok-bg: #e1f2e8;
  --warn: #8f5400; --warn-bg: #fcefd6;
  --bad: #b3261e; --bad-bg: #fbe4e2;
  --info: #1f5b99; --info-bg: #e4eefa;
  --n1: #c62828; --n2: #e46c0a; --n3: #e3b007; --n4: #5c9a2c; --n5: #1b7443;
  --n3-ink: #1b1400;
  --focus: #2b7de9;
  /* escala divergente das médias: vermelho abaixo do limite do mensal, cinza no meio, azul acima */
  --dv-r2: #d03b3b; --dv-r2-ink: #ffffff; --dv-r1: #f7c9c4; --dv-r1-ink: #0f1d2e; --dv-0: #eceae6; --dv-0-ink: #0f1d2e;
  --dv-b1: #b7d3f6; --dv-b1-ink: #0f1d2e; --dv-b2: #256abf; --dv-b2-ink: #ffffff;
  --shadow: 0 1px 2px rgba(15, 29, 46, .06), 0 6px 18px rgba(15, 29, 46, .06);
  --radius: 12px;
  --font-display: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
  --font-body: 'Barlow', 'Segoe UI', Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b131e; --surface: #111c2a; --surface-2: #17253a; --ink: #e6edf5; --muted: #9eabbc; --line: #26374c;
    --brand: #0d2742; --brand-ink: #ffffff; --primary: #5594dc; --primary-hover: #70a8e8; --primary-ink: #04101d;
    --accent: #f2b705; --accent-ink: #1b1400;
    --ok: #63c891; --ok-bg: #12301f; --warn: #f2b45a; --warn-bg: #352610; --bad: #f28b82; --bad-bg: #3b1714; --info: #85b6ee; --info-bg: #13283f;
    --n1: #e0574f; --n2: #f08a3a; --n3: #e8c22e; --n4: #7cbf4b; --n5: #3fae6f; --n3-ink: #1b1400;
    --focus: #85b6ee; --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
    --dv-r2: #c94040; --dv-r2-ink: #ffffff; --dv-r1: #5b2a28; --dv-r1-ink: #f6dcd8; --dv-0: #383835; --dv-0-ink: #e6edf5; --dv-b1: #1c4a80; --dv-b1-ink: #e0ebfb; --dv-b2: #5594dc; --dv-b2-ink: #04101d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b131e; --surface: #111c2a; --surface-2: #17253a; --ink: #e6edf5; --muted: #9eabbc; --line: #26374c;
  --brand: #0d2742; --brand-ink: #ffffff; --primary: #5594dc; --primary-hover: #70a8e8; --primary-ink: #04101d;
  --accent: #f2b705; --accent-ink: #1b1400;
  --ok: #63c891; --ok-bg: #12301f; --warn: #f2b45a; --warn-bg: #352610; --bad: #f28b82; --bad-bg: #3b1714; --info: #85b6ee; --info-bg: #13283f;
  --n1: #e0574f; --n2: #f08a3a; --n3: #e8c22e; --n4: #7cbf4b; --n5: #3fae6f; --n3-ink: #1b1400;
  --focus: #85b6ee; --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
  --dv-r2: #c94040; --dv-r2-ink: #ffffff; --dv-r1: #5b2a28; --dv-r1-ink: #f6dcd8; --dv-0: #383835; --dv-0-ink: #e6edf5; --dv-b1: #1c4a80; --dv-b1-ink: #e0ebfb; --dv-b2: #5594dc; --dv-b2-ink: #04101d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
h1, h2, h3 { margin: 0; line-height: 1.15; text-wrap: balance; }
h1 { font: 700 28px/1.12 var(--font-display); letter-spacing: .005em; }
h2 { font: 600 21px/1.2 var(--font-display); }
h3 { font: 600 17px/1.3 var(--font-body); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ico { display: inline-flex; flex: none; }
.ico svg { display: block; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.nome { font-weight: 600; }
.sub { font-size: 13.5px; color: var(--muted); }
.rotulo { font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.linha-botoes { display: flex; gap: 10px; flex-wrap: wrap; }
.cab-linha { display: flex; gap: 12px 20px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.grade-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

/* faixa de demonstração e topo */
.demo-faixa { background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 600; padding: 8px 16px; display: flex; gap: 6px 14px; justify-content: center; flex-wrap: wrap; text-align: center; }
.demo-faixa button { background: none; border: 0; padding: 0; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: inherit; }
.topo { background: var(--brand); color: var(--brand-ink); border-bottom: 4px solid var(--accent); }
.topo-in { max-width: 1180px; margin: 0 auto; padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; background: none; border: 0; color: inherit; padding: 0; cursor: pointer; text-align: left; }
.marca-txt { display: flex; flex-direction: column; min-width: 0; }
.marca-t { font: 700 19px/1.1 var(--font-display); letter-spacing: .01em; }
.marca-s { font-size: 13px; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topo-dir { display: flex; align-items: center; gap: 10px; flex: none; }
.ciclo { font-size: 13px; font-weight: 600; background: rgba(255, 255, 255, .13); padding: 4px 10px; border-radius: 99px; white-space: nowrap; }
.btn-topo { background: transparent; color: inherit; border: 1px solid rgba(255, 255, 255, .4); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn-topo:hover { background: rgba(255, 255, 255, .1); }
.main { max-width: 760px; margin: 0 auto; padding: 22px 16px 48px; }
.main.largo { max-width: 1180px; }
.rodape { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px 28px; }
@media (max-width: 460px) { .ciclo { display: none; } h1 { font-size: 25px; } }

/* cartões */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.grid-cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); }
.card-acao { display: flex; flex-direction: column; gap: 10px; }
.card-acao > .btn { margin-top: auto; align-self: flex-start; }
.card-acao.destaque { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.card-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.saudacao { display: grid; gap: 4px; }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; border: 1.5px solid transparent; padding: 10px 18px; font-weight: 600; cursor: pointer; min-height: 46px; text-decoration: none; transition: background-color .15s, border-color .15s; }
.btn-primario { background: var(--primary); color: var(--primary-ink); }
.btn-primario:hover { background: var(--primary-hover); }
.btn-sec { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-sec:hover { border-color: var(--primary); }
.btn-perigo { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-bloco { width: 100%; }
.btn-sm { min-height: 36px; padding: 5px 12px; font-size: 14px; border-radius: 8px; }
.btn-link { background: none; border: 0; padding: 4px 0; color: var(--primary); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.btn-voltar { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 4px 6px 4px 0; color: var(--primary); font-weight: 600; cursor: pointer; }

/* chips e barras */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--info-bg); color: var(--info); border-color: transparent; }
.barra { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
.barra.ok > i { background: var(--ok); }
.prog-cel { display: grid; gap: 4px; min-width: 120px; }
.prog-cel .num-cel { font-size: 14px; font-variant-numeric: tabular-nums; }
.nota-pill { display: inline-block; min-width: 44px; text-align: center; font: 700 15px/1 var(--font-display); padding: 5px 8px; border-radius: 99px; color: #fff; font-variant-numeric: tabular-nums; }

/* formulários */
.campo { display: flex; flex-direction: column; gap: 6px; }
.campo > label, .campo-rotulo { font-weight: 600; font-size: 15px; }
.ajuda { font-size: 13.5px; color: var(--muted); }
.input { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-size: 17px; min-height: 48px; }
.input:focus { border-color: var(--primary); }
.input-grande { font: 600 24px/1.2 var(--font-display); letter-spacing: .08em; text-align: center; }
.input-sm { min-height: 38px; padding: 6px 10px; font-size: 15px; border-radius: 8px; }
select.input { padding-right: 34px; }
textarea.input { min-height: 112px; resize: vertical; font-size: 16px; line-height: 1.5; }
.contador { align-self: flex-end; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.linha-ajuda { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.erro { color: var(--bad); font-weight: 600; background: var(--bad-bg); padding: 10px 12px; border-radius: 10px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; flex: none; }
fieldset { margin: 0; min-width: 0; }
fieldset legend { padding: 0; font: 600 21px/1.2 var(--font-display); float: left; width: 100%; }
fieldset legend + * { clear: both; }

/* login */
.login-wrap { display: grid; gap: 18px; max-width: 460px; margin: 6px auto 0; }
.passos { display: flex; gap: 6px; }
.passos span { flex: 1; height: 5px; border-radius: 99px; background: var(--line); }
.passos span.on { background: var(--accent); }
.confirma-nome { font: 700 27px/1.15 var(--font-display); }

/* itens com nota 1 a 5 */
.item { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; scroll-margin-top: 96px; }
.item.falta { border-color: var(--bad); background: var(--bad-bg); }
.item-top { display: flex; gap: 10px; align-items: baseline; }
.item-n { font: 700 15px/1 var(--font-display); color: var(--muted); min-width: 22px; font-variant-numeric: tabular-nums; }
.item-t { font-weight: 600; flex: 1; }
.item-v { font-size: 13px; font-weight: 700; white-space: nowrap; color: var(--muted); }
.notas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.nota { min-height: 50px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface-2); font: 700 21px/1 var(--font-display); cursor: pointer; color: var(--ink); transition: background-color .12s, border-color .12s; }
.nota:hover { border-color: var(--primary); }
.nota.sel { color: #fff; }
.nota.sel.n1 { background: var(--n1); border-color: var(--n1); }
.nota.sel.n2 { background: var(--n2); border-color: var(--n2); }
.nota.sel.n3 { background: var(--n3); border-color: var(--n3); color: var(--n3-ink); }
.nota.sel.n4 { background: var(--n4); border-color: var(--n4); }
.nota.sel.n5 { background: var(--n5); border-color: var(--n5); }
.escala { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.leg-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: #fff; font: 700 14px/1 var(--font-display); }
.leg-n.n1 { background: var(--n1); } .leg-n.n2 { background: var(--n2); } .leg-n.n3 { background: var(--n3); color: var(--n3-ink); } .leg-n.n4 { background: var(--n4); } .leg-n.n5 { background: var(--n5); }
.progresso { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.progresso .linha { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; }
.obs-toggle { justify-self: start; }
.lead { font-size: 17.5px; line-height: 1.55; }
.cal { display: grid; gap: 10px; }
.cal-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-cab strong { font: 600 19px/1.2 var(--font-display); }
.cal-nav { width: 42px; height: 42px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 700 22px/1 var(--font-display); cursor: pointer; }
.cal-nav:hover { border-color: var(--primary); }
.cal-grade { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-sem { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 2px 0; }
.cal-dia { position: relative; min-height: 50px; padding: 4px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; }
.cal-dia:hover:not(:disabled) { border-color: var(--primary); }
.cal-dia.fds { background: var(--surface-2); }
.cal-dia.fora { opacity: .45; }
.cal-dia:disabled { cursor: not-allowed; opacity: .3; }
.cal-dia.sel { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.cal-n { font: 700 14px/1 var(--font-display); padding: 3px 5px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.cal-dia.hoje .cal-n { background: var(--accent); color: var(--accent-ink); }
.cal-qtd { margin-top: auto; align-self: flex-end; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--primary); color: var(--primary-ink); font: 700 12px/20px var(--font-body); text-align: center; }
.cal-dia.atraso .cal-qtd { background: var(--bad); color: #fff; }
.cal-nomes { display: none; width: 100%; font-size: 11.5px; line-height: 1.3; color: var(--muted); }
.cal-nomes span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (min-width: 720px) { .cal.nomes .cal-dia { min-height: 88px; } .cal.nomes .cal-nomes { display: block; } }
.cal-legenda { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.cal-legenda span { display: inline-flex; align-items: center; gap: 6px; }
.cal-mk { display: inline-block; width: 14px; height: 14px; border-radius: 99px; background: var(--primary); }
.cal-mk.atraso { background: var(--bad); } .cal-mk.hoje { background: var(--accent); border-radius: 4px; }
.cal-detalhe { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
.orient { gap: 12px; }
.orient.pos { border-top: 4px solid var(--ok); }
.orient.neg { border-top: 4px solid var(--bad); }
.lista-ico { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.lista-ico li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.lista-ico .ico { margin-top: 2px; }
.orient.pos .ico { color: var(--ok); } .orient.neg .ico { color: var(--bad); } .orient.info .ico, .orient.dica .ico { color: var(--info); }
.compromisso { border: 2px solid var(--accent); }
.compromisso .check { font-weight: 600; font-size: 16.5px; }
.porque { display: grid; gap: 6px; }
.porque > label { font-size: 14px; font-weight: 600; color: var(--muted); }
.porque.obrig > label { color: var(--bad); }
.porque textarea.input { min-height: 64px; font-size: 15.5px; }
.grupo-extra { gap: 10px; }
.grupo-extra.falta { border-color: var(--bad); background: var(--bad-bg); }
.campo-linha { display: grid; grid-template-columns: 28px 1fr; align-items: center; gap: 10px; }
.num-extra { font: 700 18px/1 var(--font-display); color: var(--muted); text-align: center; }
.atalhos { display: flex; gap: 8px; flex-wrap: wrap; }

/* avisos e telas de conclusão */
.aviso { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius); background: var(--info-bg); }
.aviso > .ico { color: var(--info); margin-top: 1px; }
.aviso.warn { background: var(--warn-bg); } .aviso.warn > .ico { color: var(--warn); }
.aviso.ok { background: var(--ok-bg); } .aviso.ok > .ico { color: var(--ok); }
.centro { align-items: center; text-align: center; padding: 32px 20px; }
.selo-ok { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-bg); color: var(--ok); }

/* abas e filtros */
.abas { display: flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); padding: 4px; border-radius: 12px; }
.aba { border: 0; background: transparent; padding: 9px 14px; border-radius: 9px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--muted); flex: 1 0 auto; }
.aba.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filtros .input { flex: 1 1 220px; width: auto; }
.chips-filtro { display: flex; gap: 6px; flex-wrap: wrap; }
.filtro { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
.filtro.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }

/* listas e tabelas */
.lista { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.linha-pessoa { display: flex; align-items: center; gap: 10px 12px; padding: 12px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.linha-pessoa:first-child { border-top: 0; }
.linha-pessoa .quem { min-width: 0; flex: 1 1 200px; }
.linha-pessoa .dir { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; margin-left: auto; }
.vazio { padding: 18px; color: var(--muted); text-align: center; }
.tabela-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: middle; }
tbody tr:first-child td { border-top: 0; }
tr.clicavel { cursor: pointer; }

/* indicadores e resultados */

.res-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.res-sub.alerta { color: var(--bad); font-weight: 600; display: flex; gap: 4px; align-items: center; }
.delta { font-size: 12.5px; font-weight: 700; margin-left: 6px; white-space: nowrap; }
.delta.sobe { color: var(--ok); } .delta.desce { color: var(--bad); }
.res-v { font: 700 19px/1 var(--font-display); text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .res-item { grid-template-columns: minmax(0, 1fr) 46px; row-gap: 6px; } .res-barra { grid-column: 1 / -1; grid-row: 2; } }
.citacoes { display: grid; gap: 10px; }
.citacao { margin: 0; padding: 12px 14px; background: var(--surface-2); border-left: 4px solid var(--accent); border-radius: 0 10px 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.lista-simples { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.vezes { display: inline-block; margin-left: 8px; font: 700 13px/1 var(--font-display); color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px 7px; vertical-align: 1px; }
.fases { display: flex; gap: 8px; flex-wrap: wrap; }
.nota-pill.dv-r2, .mapa td.dv-r2 { background: var(--dv-r2); color: var(--dv-r2-ink); }
.nota-pill.dv-r1, .mapa td.dv-r1 { background: var(--dv-r1); color: var(--dv-r1-ink); }
.nota-pill.dv-0, .mapa td.dv-0 { background: var(--dv-0); color: var(--dv-0-ink); }
.nota-pill.dv-b1, .mapa td.dv-b1 { background: var(--dv-b1); color: var(--dv-b1-ink); }
.nota-pill.dv-b2, .mapa td.dv-b2 { background: var(--dv-b2); color: var(--dv-b2-ink); }
.nota-pill.dv-vazio { background: var(--surface-2); color: var(--muted); }
.escala-dv { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.escala-dv span { display: inline-flex; align-items: center; gap: 6px; }
.escala-dv i { width: 18px; height: 12px; border-radius: 3px; display: inline-block; }
.mapa table { font-size: 14px; }
.mapa th.col { text-align: center; padding: 8px 4px; min-width: 40px; }

.mapa td.cel.vazia { color: var(--muted); font-weight: 500; }
.mapa td.quem { white-space: nowrap; }
.legenda-itens { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 2px 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); font-size: 13.5px; color: var(--muted); }

.resp { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

.resp[open] > summary::after { content: '–'; }
.resp > summary .quem { flex: 1 1 200px; min-width: 0; }
.resp-corpo { padding: 0 14px 14px; display: grid; gap: 12px; }
.nota-linha { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.nota-linha:first-child { border-top: 0; }

.ag-data { font: 700 17px/1.1 var(--font-display); font-variant-numeric: tabular-nums; min-width: 78px; }

/* configurações */
.linha-config { display: flex; gap: 14px 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.linha-config > div:first-child { flex: 1 1 280px; display: grid; gap: 4px; }
.interruptor { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }

.interruptor button + button { border-left: 1.5px solid var(--line); }

.crit.inativo .input { text-decoration: line-through; color: var(--muted); }

@media (max-width: 640px) { .crit { grid-template-columns: 40px minmax(0, 1fr); } .crit-acoes { grid-column: 2; } }

/* modal, aviso flutuante e carregamento */
.modal-fundo { position: fixed; inset: 0; background: rgba(6, 14, 24, .55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 12px; }
@media (min-width: 640px) { .modal-fundo { align-items: center; } }
.modal { background: var(--surface); color: var(--ink); width: 100%; max-width: 580px; max-height: calc(100% - 12px); overflow: auto; border-radius: 16px; padding: 20px; display: grid; gap: 16px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal.largo { max-width: 760px; }
.modal-cab { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.modal-x { background: none; border: 0; padding: 4px; cursor: pointer; color: var(--muted); border-radius: 8px; }
.modal-acoes { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
body.com-modal { overflow: hidden; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; width: min(92vw, 460px); pointer-events: none; }
.toast { background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow); font-weight: 500; pointer-events: auto; }
.toast.erro { background: var(--bad); color: #fff; }
#carregando { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 70; overflow: hidden; display: none; }
body.ocupado #carregando { display: block; }
body.ocupado { cursor: progress; }
#carregando i { position: absolute; top: 0; bottom: 0; width: 40%; background: var(--accent); animation: corre 1s ease-in-out infinite; }
@keyframes corre { from { left: -40%; } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) {
  #carregando i { animation: none; left: 0; width: 100%; opacity: .7; }
  * { transition: none !important; scroll-behavior: auto !important; }
}

<body>
<div id="carregando" aria-hidden="true"><i></i></div>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<script src="config.js"></script>
<script>
(function () {

  function logo() {

  }
  function h(tag, attrs) {

      else if (k === 'checked') el.checked = !!v;

  function limpar(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  // ------------------------------------------------------------ formatação
  function n1(x) {
    if (x === null || x === undefined || x === '' || isNaN(Number(x))) return '–';
    return Number(x).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }
  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function dataBR(iso) {
    if (!iso) return '';
    var p = String(iso).slice(0, 10).split('-');

  }
  function hojeISO() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function somarMeses(iso, m) {
    var p = iso.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1 + m, p[2]);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function limite() { return (S.home && S.home.limiteMensal) || 3.5; }
  // Classe da escala divergente: dois degraus abaixo do limite do mensal, cinza logo acima, dois degraus de azul.
  function classeMedia(v) {
    if (v === null || v === undefined || v === '' || isNaN(Number(v))) return 'dv-vazio';
    var m = limite(), x = Number(v);
    if (x < m - 0.5) return 'dv-r2';
    if (x < m) return 'dv-r1';
    if (x < m + 0.5) return 'dv-0';
    if (x < m + 1) return 'dv-b1';
    return 'dv-b2';
  }
  function escalaDivergente() {
    var m = limite();
    var f = function (x) { return n1(x); };
    var faixas = [['dv-r2', 'abaixo de ' + f(m - 0.5)], ['dv-r1', f(m - 0.5) + ' a ' + f(m - 0.1)], ['dv-0', f(m) + ' a ' + f(m + 0.4)],
      ['dv-b1', f(m + 0.5) + ' a ' + f(m + 0.9)], ['dv-b2', f(m + 1) + ' ou mais']];
    return h('div', { class: 'escala-dv', 'aria-label': 'Legenda das cores' }, faixas.map(function (x) {
      return h('span', null, h('i', { style: 'background:var(--' + x[0] + ')' }), x[1]);
    }), h('span', null, 'Limite do acompanhamento mensal: ' + n1(m)));
  }
  var DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  function diaSemana(iso) { var p = String(iso).split('-').map(Number); return DIAS[new Date(p[0], p[1] - 1, p[2]).getDay()]; }
  function somarDias(iso, n) {
    var p = iso.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2] + n);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function proximoDiaUtil(iso) { var d = iso; while (/^(domingo|sábado)$/.test(diaSemana(d))) d = somarDias(d, 1); return d; }
  function faixaCritica(c) { return c <= 1 ? '1' : c === 2 ? '1 e 2' : '1 a ' + c; }
  function notasCriticas(c) { return c <= 1 ? 'A nota 1 precisa' : 'As notas ' + faixaCritica(c) + ' precisam'; }
  function mascaraCpf(v) {

  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

  // ------------------------------------------------------------ servidor

  // Na demonstração, a página fala com um servidor que roda no próprio navegador (google.script.run simulado).

    var t = S.token;
    S.token = null; guardarToken(null); S.home = null; S.login = novoLogin(); S.adm = { aba: 'painel' };

  function editarPessoa(p, novo) {
    var ativos = S.adm.pessoas.pessoas.filter(function (x) { return x.ativo && x.mat !== p.mat; });
    var mat = h('input', { class: 'input', id: 'pMat', value: p.mat, inputmode: 'numeric', readonly: !novo });
    var nome = h('input', { class: 'input', id: 'pNome', value: p.nome, maxlength: '120' });
    var cc = h('input', { class: 'input', id: 'pCC', value: p.cc, maxlength: '60' });
    var lider = h('select', { class: 'input', id: 'pLider' }, [h('option', { value: '' }, 'Sem líder')].concat(ativos.map(function (x) {
      return h('option', { value: x.mat, selected: x.mat === p.liderMat }, x.nome + ' (' + x.mat + ')');
    })));
    var perfil = h('select', { class: 'input', id: 'pPerfil' }, [['COLABORADOR', 'Colaborador (avalia o líder; se liderar alguém, vira líder)'], ['RH', 'RH (acessa o painel de gestão)'], ['COORDENACAO', 'Coordenação (acessa o painel de gestão)']].map(function (o) {
      return h('option', { value: o[0], selected: o[0] === p.perfil }, o[1]);
    }));
    var ativo = h('input', { type: 'checkbox', id: 'pAtivo', checked: p.ativo });
    var cpf = h('input', { class: 'input', id: 'pCpf', inputmode: 'numeric', autocomplete: 'off', placeholder: novo || !p.temCpf ? '000.000.000-00' : 'Deixe em branco para manter o atual' });
    cpf.addEventListener('input', function () { cpf.value = mascaraCpf(cpf.value); });
    var salvar = h('button', { class: 'btn btn-primario', type: 'button' }, 'Salvar');
    var m = modal(novo ? 'Nova pessoa' : p.nome, [
      h('div', { class: 'grade-2' }, campo('pMat', 'Matrícula', mat, novo ? null : 'A matrícula não muda.'), campo('pCC', 'C.C (centro de custo)', cc)),
      campo('pNome', 'Nome completo', nome),
      campo('pLider', 'Líder', lider, 'Quem avalia esta pessoa e é avaliado por ela.'),
      campo('pPerfil', 'Perfil de acesso', perfil),
      campo('pCpf', 'CPF (senha de acesso)', cpf, 'Fica guardado criptografado. Ninguém consegue ver depois de salvo.'),
      h('label', { class: 'check', for: 'pAtivo' }, ativo, h('span', null, 'Ativo (desmarque para desligados)'))
    ], [h('button', { class: 'btn btn-sec', type: 'button', onclick: function () { m.fechar(); } }, 'Cancelar'), salvar], true);
    salvar.addEventListener('click', function () {
      salvar.disabled = true;
      chamar('salvarPessoa', {
        novo: novo, mat: mat.value.trim(), nome: nome.value, cc: cc.value, liderMat: lider.value, perfil: perfil.value,
        ativo: ativo.checked, cpf: cpf.value.replace(/\D/g, '')
      }).then(function () {
        m.fechar();
        toast(novo ? 'Pessoa cadastrada.' : 'Cadastro atualizado.');
        carregarAba();
      }).catch(function (e) { salvar.disabled = false; falha(e); });
    });
  }

  // ---- importação da base
  var promessaXlsx = null;
  function carregarXlsx() {
    if (window.XLSX) return Promise.resolve();
    if (promessaXlsx) return promessaXlsx;
    promessaXlsx = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = function () { resolve(); };
      s.onerror = function () { promessaXlsx = null; reject(new Error('Não consegui carregar o leitor de planilhas. Confira a internet.')); };
      document.head.appendChild(s);
    });
    return promessaXlsx;
  }
  function lerPlanilha(arquivo) {
    return carregarXlsx().then(function () {
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var wb = window.XLSX.read(new Uint8Array(fr.result), { type: 'array' });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var m = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
            m = m.filter(function (l) { return l.some(function (v) { return String(v).trim() !== ''; }); })
              .map(function (l) { return l.map(function (v) { return String(v); }); });
            if (m.length < 2) { reject(new Error('A planilha está vazia.')); return; }
            resolve(m);
          } catch (e) { reject(new Error('Não consegui ler o arquivo. Salve como .xlsx ou .csv e tente de novo.')); }
        };
        fr.onerror = function () { reject(new Error('Não consegui abrir o arquivo.')); };
        fr.readAsArrayBuffer(arquivo);
      });
    });
  }
  function resumoImportacao(r) {
    var nomesCol = { mat: 'Matrícula', nome: 'Nome', lider: 'Líder', cc: 'C.C', cpf: 'CPF', perfil: 'Perfil' };
    var cols = Object.keys(r.colunas).map(function (k) { return nomesCol[k] + ' ← “' + r.colunas[k] + '”'; }).join(' · ');
    var pend = r.lideres.filter(function (l) { return !l.encontrado; });
    return [
      h('div', { class: 'kpis', style: 'grid-template-columns:repeat(auto-fit,minmax(120px,1fr))' },
        kpi(String(r.linhas), 'linhas lidas'), kpi(String(r.novos), 'novas pessoas'), kpi(String(r.atualizados), 'atualizadas'),
        r.desativados ? kpi(String(r.desativados), 'serão desativadas', 'var(--warn)') : null),
      h('p', { class: 'small' }, h('b', null, 'Colunas encontradas: '), cols),
      r.faltando.length ? aviso('warn', 'Colunas não encontradas: ' + r.faltando.map(function (k) { return nomesCol[k]; }).join(', ') + '.') : null,
      r.semCpf.length ? aviso('warn', plural(r.semCpf.length, 'pessoa sem CPF', 'pessoas sem CPF') + ' (não vão conseguir entrar): matrícula ' + r.semCpf.slice(0, 15).join(', ') + (r.semCpf.length > 15 ? '…' : '')) : null,
      r.cpfInvalido.length ? aviso('warn', 'CPF com dígito verificador errado nas matrículas ' + r.cpfInvalido.slice(0, 15).join(', ') + '. Importo assim mesmo; confira na base.') : null,
      r.duplicados.length ? aviso('warn', 'Matrículas repetidas (fica a primeira linha): ' + r.duplicados.join(', ')) : null,
      h('div', { class: 'stack', style: 'gap:8px' }, h('h3', null, 'Líderes encontrados na coluna Liderança'),
        h('div', { class: 'lista' }, r.lideres.map(function (l) {
          return h('div', { class: 'linha-pessoa' }, h('div', { class: 'quem' }, h('div', { class: 'nome' }, l.nome), h('div', { class: 'sub' }, plural(l.liderados, 'liderado', 'liderados'))),
            h('div', { class: 'dir' }, l.encontrado ? chip('ok', 'Cadastrado') : chip('warn', 'Sem cadastro')));
        }))),
      pend.length ? aviso('warn', 'Quem aparece como "Sem cadastro" precisa ser cadastrado com o mesmo nome (em Nova pessoa). Até lá, os liderados dele ficam sem líder.') : null
    ];
  }
  function abrirImportacao() {
    var estado = { matriz: null, desativar: false };
    var arquivo = h('input', { type: 'file', id: 'arqBase', accept: '.xlsx,.xls,.csv', class: 'input' });
    var chk = h('input', { type: 'checkbox', id: 'chkDes' });
    var resumo = h('div', { class: 'stack' });
    var importar = h('button', { class: 'btn btn-primario', type: 'button', disabled: true }, 'Importar');
    var m = modal('Importar base de colaboradores', [
      h('p', { class: 'small' }, 'Use a planilha da base (como a sra_feedback.xlsx) com as colunas Matrícula, Nome, Liderança, C.C e CPF. O CPF vira a senha de cada pessoa e fica guardado criptografado.'),
      campo('arqBase', 'Arquivo .xlsx ou .csv', arquivo),
      h('label', { class: 'check', for: 'chkDes' }, chk, h('span', null, 'Desativar quem não estiver nesta base (desligados). RH e coordenação não são desativados.')),
      resumo
    ], [h('button', { class: 'btn btn-sec', type: 'button', onclick: function () { m.fechar(); } }, 'Cancelar'), importar], true);
    function simular() {
      importar.disabled = true;
      limpar(resumo);
      resumo.appendChild(h('p', { class: 'muted small' }, 'Conferindo a base…'));
      chamar('importar', { matriz: estado.matriz, simular: true, desativarAusentes: estado.desativar }).then(function (r) {
        limpar(resumo); anexar(resumo, resumoImportacao(r)); importar.disabled = false;
      }).catch(function (e) { limpar(resumo); resumo.appendChild(aviso('warn', e.message)); });
    }
    chk.addEventListener('change', function () { estado.desativar = chk.checked; if (estado.matriz) simular(); });
    arquivo.addEventListener('change', function () {
      var f = arquivo.files && arquivo.files[0];
      if (!f) return;
      limpar(resumo);
      resumo.appendChild(h('p', { class: 'muted small' }, 'Lendo ' + f.name + '…'));
      lerPlanilha(f).then(function (matriz) { estado.matriz = matriz; simular(); })
        .catch(function (e) { limpar(resumo); resumo.appendChild(aviso('warn', e.message)); });
    });
    importar.addEventListener('click', function () {
      importar.disabled = true;
      chamar('importar', { matriz: estado.matriz, simular: false, desativarAusentes: estado.desativar }).then(function (r) {
        m.fechar();
        toast('Base importada: ' + r.novos + ' novos, ' + r.atualizados + ' atualizados' + (r.desativados ? ', ' + r.desativados + ' desativados' : '') + '.');
        carregarAba();
      }).catch(function (e) { importar.disabled = false; falha(e); });
    });
  }

  // ---- exportação
  function botaoExportar(tipo, rotulo) {
    return h('button', { class: 'btn btn-sec btn-sm', type: 'button', onclick: function () { exportar(tipo); } }, ico('baixar', 16), rotulo || 'Exportar');
  }
  function celulaCsv(v) {
    var s = v === null || v === undefined ? '' : String(v);
    if (/^[=+\-@]/.test(s)) s = "'" + s;
    return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportar(tipo) {
    chamar('exportar', { tipo: tipo, ciclo: S.adm.ciclo || '' }).then(function (d) {
      var todas = [d.cabecalho].concat(d.linhas);
      var csv = '﻿' + todas.map(function (l) { return l.map(celulaCsv).join(';'); }).join('\r\n');
      var tsv = todas.map(function (l) { return l.map(function (v) { return String(v === null || v === undefined ? '' : v).replace(/[\t\r\n]+/g, ' '); }).join('\t'); }).join('\n');
      var acoes = [];
      if (!DEMO) {
        acoes.push(h('button', { class: 'btn btn-primario', type: 'button', onclick: function () {
          var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
          var a = h('a', { href: url, download: d.arquivo + '.csv', style: 'display:none' });
          document.body.appendChild(a); a.click();
          setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
        } }, ico('baixar', 18), 'Baixar CSV'));
      }
      acoes.push(h('button', { class: 'btn ' + (DEMO ? 'btn-primario' : 'btn-sec'), type: 'button', onclick: function () {
        copiarComAviso(tsv, 'Tabela copiada. Cole no Excel ou no Google Planilhas.');
      } }, ico('copiar', 18), 'Copiar tabela'));
      modal('Exportar', [
        h('p', null, plural(d.linhas.length, 'linha', 'linhas') + ' e ' + plural(d.cabecalho.length, 'coluna', 'colunas') + '.'),
        d.observacao ? h('p', { class: 'muted small' }, d.observacao) : null,
        DEMO ? h('p', { class: 'muted small' }, 'Na demonstração dá para copiar a tabela. Na versão oficial também aparece o botão de baixar em CSV.') : null
      ], acoes);
    }).catch(falha);
  }

  // ---- fases, ciclo e critérios
  function salvarConfig(dados, msgSucesso) {
    return chamar('salvarConfig', dados).then(function (d) {
      S.adm.config = d;
      toast(msgSucesso || 'Configuração salva.');
      return chamar('home').then(function (hm) { S.home = hm; render(); });
    }).catch(falha);
  }
  function interruptor(id, valor, aoMudar) {
    return h('div', { class: 'interruptor', role: 'group', 'aria-labelledby': id },
      ['ABERTA', 'FECHADA'].map(function (v) {
        return h('button', { type: 'button', class: valor === v ? 'on' : '', 'aria-pressed': valor === v ? 'true' : 'false', onclick: function () { if (valor !== v) aoMudar(v); } }, v === 'ABERTA' ? 'Aberta' : 'Fechada');
      }));
  }
  function admConfig() {
    var D = S.adm.config;
    if (!D) return null;
    var C = D.config;
    var novoCiclo = h('input', { class: 'input input-sm', id: 'novoCiclo', placeholder: 'ex.: 2027-1', maxlength: '6', style: 'max-width:160px' });
    var limiteInp = h('input', { class: 'input input-sm', id: 'limiteMensal', type: 'number', min: '1', max: '5', step: '0.1', value: String(C.limiteMensal), style: 'max-width:110px' });
    var critica = h('select', { class: 'input input-sm', id: 'notaCritica', style: 'max-width:220px' }, [[0, 'Não usar'], [1, 'Nota 1'], [2, 'Notas 1 e 2'], [3, 'Notas 1 a 3']].map(function (o) {
      return h('option', { value: String(o[0]), selected: o[0] === C.notaCritica }, o[1]);
    }));
    return h('div', { class: 'stack' },
      h('section', { class: 'card stack' },
        h('div', null, h('span', { class: 'rotulo' }, 'Ciclo atual'), h('h2', null, D.cicloRotulo)),
        h('div', { class: 'linha-config' },
          h('div', null, h('h3', { id: 'tFase1' }, '1. Liderado x Líder'), h('p', { class: 'muted small' }, 'Cada pessoa avalia o próprio líder, com o porquê das notas. Quem é liderado direto da coordenação também escreve 3 pontos fortes e 3 fracos. A gestão acompanha as respostas a qualquer momento.')),
          interruptor('tFase1', C.faseLideradoLider, function (v) {
            if (v === 'FECHADA') confirmar('Fechar a avaliação do líder?', 'Ninguém mais consegue responder neste ciclo. Depois, libere o resultado para os líderes prepararem as conversas.', 'Fechar avaliação', function () { salvarConfig({ faseLideradoLider: v }, 'Avaliação do líder fechada.'); });
            else salvarConfig({ faseLideradoLider: v }, 'Avaliação do líder aberta.');
          })),
        h('div', { class: 'linha-config' },
          h('div', null, h('h3', { id: 'tFase2' }, '2. Líder x Liderado'), h('p', { class: 'muted small' }, 'Líderes avaliam cada liderado no dia da conversa presencial, com o porquê das notas e o plano combinado. Supervisores e todos que respondem direto à coordenação são avaliados com os itens de liderança e 3 pontos fortes e 3 fracos.')),
          interruptor('tFase2', C.faseLiderLiderado, function (v) { salvarConfig({ faseLiderLiderado: v }, v === 'ABERTA' ? 'Avaliação dos liderados aberta.' : 'Avaliação dos liderados fechada.'); })),
        h('div', { class: 'linha-config' },
          h('div', null, h('h3', null, 'Resultado para os líderes'), h('p', { class: 'muted small' }, 'Depois de liberar, cada líder vê as respostas da equipe com o nome de quem respondeu e o porquê de cada nota. O ideal é liberar quando a avaliação do líder fechar.')),
          h('button', { class: 'btn btn-sm ' + (D.liberado ? 'btn-sec' : 'btn-primario'), type: 'button', onclick: function () {
            salvarConfig({ liberar: !D.liberado }, D.liberado ? 'Resultado recolhido.' : 'Resultado liberado para os líderes.');
          } }, D.liberado ? 'Recolher resultado' : 'Liberar resultado')),
        h('div', { class: 'linha-config' },
          h('div', null, h('h3', null, 'Frequência do feedback'), h('p', { class: 'muted small' }, 'Depois das notas, cada pessoa fica com acompanhamento mensal (uma conversa por mês) ou feedback semestral. Vai para o mensal quem tem média abaixo do limite ou recebe a nota crítica em algum item. Para líderes, conta também a média que a equipe deu. A nota crítica também obriga a explicar o porquê.')),
          h('div', { class: 'linha-botoes', style: 'align-items:flex-end' },
            campo('limiteMensal', 'Média mínima', limiteInp),
            campo('notaCritica', 'Nota crítica', critica),
            h('button', { class: 'btn btn-sec btn-sm', type: 'button', onclick: function () {
              salvarConfig({ limiteMensal: limiteInp.value, notaCritica: Number(critica.value) }, 'Regra de frequência salva.');
            } }, 'Salvar')))),
      h('section', { class: 'card stack' },
        h('h2', null, 'Novo ciclo'),
        h('p', { class: 'muted small' }, 'Use no próximo semestre. As respostas do ciclo atual ficam guardadas no histórico e as duas fases começam fechadas.'),
        h('div', { class: 'linha-botoes' }, novoCiclo, h('button', { class: 'btn btn-sec btn-sm', type: 'button', onclick: function () {
          var v = novoCiclo.value.trim();
          if (!/^\d{4}-[12]$/.test(v)) { toast('Use o formato ANO-SEMESTRE, por exemplo 2027-1.', 'erro'); return; }
          confirmar('Iniciar o ciclo ' + v + '?', 'O ciclo atual vira histórico. Depois abra a fase 1 para começar.', 'Iniciar', function () { salvarConfig({ novoCiclo: v }, 'Novo ciclo iniciado.'); });
        } }, 'Iniciar novo ciclo'))),
      editorCriterios(D.criterios, 'LIDERADO_LIDER', 'Itens da avaliação do líder (Liderado x Líder)'),
      editorCriterios(D.criterios, 'LIDER_LIDERADO', 'Itens da avaliação do liderado (Líder x Liderado)'));
  }
  function salvarCriterio(dados) {
    chamar('salvarCriterio', dados).then(function (r) { S.adm.config.criterios = r.criterios; toast('Itens atualizados.'); render(); }).catch(falha);
  }
  function editorCriterios(lista, form, titulo) {
    var itens = lista.filter(function (c) { return c.form === form; });
    var novo = h('input', { class: 'input input-sm', id: 'novo-' + form, placeholder: 'Texto do novo item', maxlength: '200' });
    return h('section', { class: 'card stack' },
      h('h2', null, titulo),
      h('p', { class: 'muted small' }, 'Mudanças valem para quem responder depois. Item desativado some do formulário, mas o histórico continua.'),
      h('div', { class: 'crit-lista' }, itens.map(function (c, i) {
        var inp = h('input', { class: 'input input-sm', value: c.texto, maxlength: '200', 'aria-label': 'Texto do item ' + c.id });
        return h('div', { class: 'crit' + (c.ativo ? '' : ' inativo') },
          h('span', { class: 'crit-id' }, c.id), inp,
          h('div', { class: 'crit-acoes' },
            h('button', { class: 'btn btn-sec btn-sm', type: 'button', onclick: function () { salvarCriterio({ id: c.id, texto: inp.value }); } }, 'Salvar'),
            h('button', { class: 'btn btn-sec btn-sm', type: 'button', 'aria-label': 'Subir ' + c.id, disabled: i === 0, onclick: function () { salvarCriterio({ id: c.id, mover: -1 }); } }, '↑'),
            h('button', { class: 'btn btn-sec btn-sm', type: 'button', 'aria-label': 'Descer ' + c.id, disabled: i === itens.length - 1, onclick: function () { salvarCriterio({ id: c.id, mover: 1 }); } }, '↓'),
            h('button', { class: 'btn btn-sec btn-sm', type: 'button', onclick: function () { salvarCriterio({ id: c.id, ativo: !c.ativo }); } }, c.ativo ? 'Desativar' : 'Ativar')));
      })),
      h('div', { class: 'linha-botoes' }, h('div', { style: 'flex:1 1 260px' }, novo),
        h('button', { class: 'btn btn-sec btn-sm', type: 'button', onclick: function () {
          if (!novo.value.trim()) { toast('Escreva o texto do item.', 'erro'); return; }
          salvarCriterio({ form: form, texto: novo.value });
        } }, ico('mais', 16), 'Adicionar item')));
  }

  var ADM = { painel: admPainel, participacao: admParticipacao, resultados: admResultados, ll: admLL, cronograma: admCronograma, analises: admAnalises, pessoas: admPessoas, config: admConfig };
  var VIEWS = {
    carregando: vCarregando, semServidor: vSemServidor, configurar: vConfigurar, login: vLogin, inicio: vInicio, orientacao: vOrientacao, formLider: vFormLider, obrigado: vObrigado,
    orientacaoLider: vOrientacaoLider,
    equipe: vEquipe, formLiderado: vFormLiderado, meuFeedback: vMeuFeedback, resultados: vResultados, admin: vAdmin
  };

  function iniciar() {
    if (!temServidor()) { ir('semServidor'); return; }
    if (location.hash === '#configurar') { ir('configurar'); return; }
    var t = tokenGuardado();
    if (!t) { ir('login'); return; }
    S.token = t;
    render();
    chamar('home').then(function (d) { S.home = d; ir('inicio'); }).catch(function () {
      S.token = null; guardarToken(null); S.login = novoLogin(); ir('login');
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();
</script>
